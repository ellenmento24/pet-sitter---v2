<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Patinhas</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Patinhas">
<meta name="theme-color" content="#f7f3ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151311" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#f7f3ee;--card:#fff;--ink:#2b2622;--muted:#8a8078;--line:#ece4da;
  --accent:#2f7d6d;--accent-soft:#e3f1ec;--warn:#b5741f;--warn-soft:#fbefdc;
  --danger:#c4513f;--danger-soft:#fbe7e3;--chip:#f1ebe3;
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#151311;--card:#211e1b;--ink:#f1ebe4;--muted:#a1968c;--line:#332e29;
    --accent:#5bbfa8;--accent-soft:#1d3530;--warn:#e0a35a;--warn-soft:#3a2d1c;
    --danger:#e17a68;--danger-soft:#3b211d;--chip:#2c2824;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
body{min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
.hdr{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:6px;
  padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;
  background:var(--bg);background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.hdr h1{flex:1;margin:0;font-size:26px;font-weight:750;letter-spacing:-.02em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr.sub h1{font-size:19px;font-weight:650}
.hdr-btn{border:0;background:none;color:var(--accent);font-size:17px;font-weight:600;
  padding:6px 4px;text-decoration:none;display:inline-flex;align-items:center}
.hdr-btn svg{width:24px;height:24px}
#hdr-back[hidden]{display:none}
#hdr-back{font-size:30px;line-height:1;padding:0 8px 4px 0}
main{padding:2px 16px 24px;max-width:680px;margin:0 auto}
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;
  background:var(--card);background:color-mix(in srgb,var(--card) 92%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;
  color:var(--muted);text-decoration:none;padding:4px 0;font-weight:500}
.tabs svg{width:25px;height:25px}
.tabs a.on{color:var(--accent)}
.fab{position:fixed;right:18px;bottom:calc(86px + env(safe-area-inset-bottom));width:58px;height:58px;
  border-radius:50%;background:var(--accent);color:#fff;font-size:32px;font-weight:300;
  display:grid;place-items:center;text-decoration:none;box-shadow:0 8px 22px rgba(0,0,0,.2);z-index:15}
.fab[hidden]{display:none}
.card{background:var(--card);border-radius:18px;padding:14px;margin:10px 0;border:1px solid var(--line)}
.muted{color:var(--muted)}
.small{font-size:13px}
.sec{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:650;margin:22px 4px 6px}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:650;margin-bottom:4px}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .big{font-size:40px;margin-bottom:6px}
.pre{white-space:pre-wrap;word-wrap:break-word}

/* week strip */
.week{display:flex;align-items:center;gap:4px;margin:4px -6px 0}
.days{flex:1;display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{border:0;background:none;border-radius:14px;padding:6px 0 7px;display:flex;flex-direction:column;align-items:center;gap:1px}
.day span{font-size:11px;color:var(--muted);font-weight:600}
.day b{font-size:18px;font-weight:650;width:34px;height:34px;display:grid;place-items:center;border-radius:50%}
.day.today b{color:var(--accent)}
.day.sel b{background:var(--accent);color:#fff}
.day i{width:5px;height:5px;border-radius:50%;background:transparent}
.day i.dot{background:var(--accent)}
.arrow{border:0;background:none;color:var(--muted);font-size:26px;padding:4px 6px}
.day-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 2px 2px}
.day-head h2{margin:0;font-size:18px;font-weight:700;letter-spacing:-.01em}
.goto{position:relative;color:var(--accent);font-weight:600;font-size:15px;white-space:nowrap}
.goto input{position:absolute;inset:0;opacity:0;width:100%}
.link{border:0;background:none;color:var(--accent);font-weight:600;padding:8px 0;font-size:15px}

/* occurrence cards */
.occ{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
.occ-time{font-weight:750;font-size:17px;min-width:50px;font-variant-numeric:tabular-nums}
.occ-body{flex:1;min-width:0}
.occ-title{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.occ-sub,.occ-addr{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.occ.done .occ-title,.occ.done .occ-time{opacity:.45;text-decoration:line-through}
.check{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:none;
  display:grid;place-items:center;color:transparent;font-size:17px;font-weight:700}
.check.on{background:var(--accent);border-color:var(--accent);color:#fff}
.thumb{flex:none;width:46px;height:46px;border-radius:50%;object-fit:cover;background:var(--chip);
  display:grid;place-items:center;font-size:22px}
.thumb.lg{width:64px;height:64px;font-size:30px}

/* list rows */
.row{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
.row .grow{flex:1;min-width:0}
.row-title{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.right{text-align:right;flex:none}
.chev{color:var(--muted);font-size:20px}

.chip{display:inline-block;font-size:12px;font-weight:650;padding:3px 9px;border-radius:999px;background:var(--chip);color:var(--muted);white-space:nowrap;border:0}
.chip.pendente{background:var(--danger-soft);color:var(--danger)}
.chip.cobrado{background:var(--warn-soft);color:var(--warn)}
.chip.pago{background:var(--accent-soft);color:var(--accent)}
.chip.type{background:var(--chip);color:var(--ink)}

/* segmented */
.seg{display:flex;background:var(--chip);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px 4px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.seg.pay button.on.pendente{color:var(--danger)}
.seg.pay button.on.cobrado{color:var(--warn)}
.seg.pay button.on.pago{color:var(--accent)}

/* forms */
.field{margin:14px 0}
.field>label{display:block;font-size:13px;font-weight:650;color:var(--muted);margin:0 2px 6px}
input:not([type=file]),select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--card);
  border:1px solid var(--line);border-radius:12px;padding:12px;outline:none;-webkit-appearance:none;appearance:none}
input[type=date],input[type=time]{min-height:46px}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
.mt{margin-top:8px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2 .field{margin:0}
.wds{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 0;font-weight:650;color:var(--muted)}
.wd.on{background:var(--accent);border-color:var(--accent);color:#fff}
.time-row{display:flex;gap:8px;margin-bottom:8px}
.icon-btn{border:0;background:var(--chip);color:var(--muted);border-radius:12px;width:46px;flex:none;font-size:16px}
.live{background:var(--accent-soft);color:var(--accent);border-radius:12px;padding:10px 12px;font-weight:600;font-size:14px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font-weight:650;font-size:16px;margin-top:10px;text-align:center;text-decoration:none}
.btn.primary{background:var(--accent);color:#fff}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn.danger{background:none;color:var(--danger)}
.btns{display:flex;gap:8px}
.btns .btn{flex:1}

/* photos */
.photo-slot{position:relative;border:0;padding:0;overflow:hidden;background:var(--chip);color:var(--muted);flex:none}
.photo-slot.round{width:76px;height:76px;border-radius:50%}
.photo-slot.wide{width:100%;height:180px;border-radius:14px}
.photo-slot img{width:100%;height:100%;object-fit:cover;display:block}
.photo-slot.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:24px}
.photo-slot.empty span{font-size:11px;font-weight:600}
.ph-x{position:absolute;top:6px;right:6px;border:0;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:12px}
.photo-slot.round .ph-x{top:0;right:0}
.ph-change{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);border:0;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;padding:4px 10px}
.photo-slot.round .ph-change{bottom:4px;padding:2px 8px;font-size:10px}
.pet-edit{display:flex;gap:12px;align-items:center}
.pet-edit .grow{flex:1;min-width:0}

/* detail */
.pets{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 2px}
.pet{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:84px;text-align:center;border:0;background:none;padding:0}
.pet img,.pet .ph{width:84px;height:84px;border-radius:50%;object-fit:cover;background:var(--chip);display:grid;place-items:center;font-size:34px}
.pet b{font-size:15px}
.pet span{font-size:12px;color:var(--muted)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--muted)}
.kv span:last-child{text-align:right;font-weight:600}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.pill{border:0;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:650;font-size:14px;padding:8px 14px;text-decoration:none}
.keyimg{width:100%;max-height:240px;object-fit:cover;border-radius:14px;display:block;border:0;padding:0;background:var(--chip)}
.code{font:600 22px/1.2 ui-monospace,Menlo,monospace;letter-spacing:.12em;border:0;background:var(--chip);border-radius:12px;padding:10px 14px;width:100%;text-align:left}
.visit-card{border:2px solid var(--accent)}
.visit-when{font-size:19px;font-weight:700;margin-bottom:6px}
.cl{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:9px 0;text-align:left;border-bottom:1px solid var(--line)}
.cl .check{width:28px;height:28px;font-size:14px}
.vrow{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.vrow:last-child{border-bottom:0}
.vrow .grow{flex:1}
.vrow.past .grow{color:var(--muted)}
.vrow .check{width:30px;height:30px;font-size:14px}

/* finance */
.fin-nav{display:flex;align-items:center;justify-content:space-between;margin:12px 0 4px}
.fin-nav b{font-size:17px}
.total{font-size:34px;font-weight:750;letter-spacing:-.02em}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{border-radius:14px;padding:10px;background:var(--chip)}
.stat b{display:block;font-size:15px;margin-top:2px}
.stat.pago{background:var(--accent-soft);color:var(--accent)}
.stat.cobrado{background:var(--warn-soft);color:var(--warn)}
.stat.pendente{background:var(--danger-soft);color:var(--danger)}
.stat small{font-size:10.5px;font-weight:650;text-transform:uppercase;letter-spacing:0;white-space:nowrap}
.bar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--chip);margin:12px 0 4px}
.bar i{display:block;height:100%}

.search{margin:6px 0 4px}
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:100;display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#lightbox[hidden]{display:none}
#lightbox img{max-width:100%;max-height:100%;object-fit:contain}
#toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:90}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

:root{--bar:#16876d}
@media (prefers-color-scheme: dark){:root{--bar:#3aa58b}}
.card.appt{border-style:dashed;border-color:var(--warn)}
.thumb.icon{background:var(--warn-soft)}
.chip.appt{background:var(--warn-soft);color:var(--warn)}
.seg.wrap button{font-size:13px;line-height:1.2}
.visit-edit{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr) 46px;gap:8px;margin-bottom:8px}
.chart-head{display:flex;align-items:center;justify-content:space-between}
.chart-head .yr{display:flex;align-items:center;gap:2px}
.chart{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;height:160px;align-items:end;border-bottom:1px solid var(--line);margin-top:10px}
.col{height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;border:0;background:none;padding:0}
.col i{display:block;width:72%;max-width:26px;background:var(--bar);border-radius:4px 4px 0 0}
.col .val{font-size:10px;font-weight:700;color:var(--ink);margin-bottom:3px;white-space:nowrap}
.months{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;margin-top:5px}
.months span{text-align:center;font-size:10.5px;color:var(--muted)}
.months span.sel{color:var(--ink);font-weight:700}
.chart-info{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:12px;font-size:14px}
.chart-empty{text-align:center;color:var(--muted);font-size:13px;padding:8px 0 0}

.gear{position:relative}
#sync-dot{position:absolute;top:3px;right:0;width:9px;height:9px;border-radius:50%;border:2px solid var(--bg);display:none}
#sync-dot.ok{display:block;background:var(--accent)}
#sync-dot.busy{display:block;background:var(--warn)}
#sync-dot.err{display:block;background:var(--danger)}
.banner{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;background:var(--warn-soft);border-color:transparent}
.banner b{color:var(--warn)}
.sync-status{font-size:14px;margin:8px 0 2px}
.sync-status.err{color:var(--danger);font-weight:600}

/* carrossel da agenda */
.carousel{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin:8px -16px 0;cursor:grab;touch-action:pan-x pan-y}
.carousel::-webkit-scrollbar{display:none}
.carousel.dragging{cursor:grabbing;scroll-snap-type:none}
.panel{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;padding:0 16px;box-sizing:border-box}
.panel .days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mtitle{display:flex;justify-content:space-between;align-items:baseline;margin:2px 4px 8px}
.mtitle b{font-size:17px}
.mtitle span{font-size:12px;color:var(--muted)}
.mhead,.mgrid{display:grid;grid-template-columns:repeat(7,1fr)}
.mhead span{text-align:center;font-size:11px;color:var(--muted);font-weight:600;padding-bottom:2px}
.mday{border:0;background:none;padding:2px 0 3px;display:flex;flex-direction:column;align-items:center;gap:1px}
.mday b{font-size:15px;font-weight:600;width:34px;height:34px;display:grid;place-items:center;border-radius:50%}
.mday.today b{color:var(--accent)}
.mday.sel b{background:var(--accent);color:#fff}
.mday i,.day i{width:5px;height:5px;border-radius:50%;background:transparent}
.mday i.dot{background:var(--accent)}
.day i.appt,.mday i.appt{background:var(--warn)}
.swipe-hint{text-align:center;font-size:11px;color:var(--muted);margin-top:2px}
/* busca de cliente */
.pick-list{max-height:290px;overflow-y:auto;margin-top:8px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.pick-row{display:flex;align-items:center;gap:12px;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 12px;text-align:left}
.pick-row:last-child{border-bottom:0}
.pick-row .thumb{width:38px;height:38px;font-size:18px}
.pick-row .grow{display:flex;flex-direction:column;min-width:0;flex:1}
.pick-row b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.picked{margin:0}
/* financeiro: a receber */
.owed{background:var(--card);border:2px solid var(--warn);border-radius:18px;padding:14px;margin:10px 0}
.owed .total{color:var(--warn)}
.owed-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);text-decoration:none;color:inherit}
.owed-row:first-of-type{margin-top:10px}
.owed-row .grow{flex:1;min-width:0}
.pay-btn{border:0;border-radius:999px;background:var(--accent);color:#fff;font-weight:650;font-size:13px;padding:7px 12px;margin-top:6px;white-space:nowrap}
.allgood{background:var(--accent-soft);color:var(--accent);border-color:transparent;font-weight:600;text-align:center}
</style>
</head>
<body>
<header class="hdr" id="hdr">
  <button id="hdr-back" class="hdr-btn" data-action="back" hidden aria-label="Voltar">‹</button>
  <h1 id="hdr-title">Agenda</h1>
  <div id="hdr-right"></div>
</header>
<main id="view"></main>
<a id="fab" class="fab" href="#servico-editar/new" aria-label="Novo">+</a>
<nav class="tabs">
  <a href="#agenda" data-tab="agenda"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Agenda</span></a>
  <a href="#servicos" data-tab="servicos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2.5"/><path d="M9 4V3h6v1M9 10h6M9 14h6M9 18h3"/></svg><span>Serviços</span></a>
  <a href="#clientes" data-tab="clientes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6.5" cy="10" r="1.8"/><circle cx="10" cy="6" r="1.8"/><circle cx="14.5" cy="6" r="1.8"/><circle cx="18" cy="10" r="1.8"/><path d="M12.2 12c-2.6 0-5.5 3.6-5.5 6.2 0 1.6 1.2 2.3 2.6 2.3 1.3 0 1.9-.6 2.9-.6s1.6.6 2.9.6c1.4 0 2.6-.7 2.6-2.3 0-2.6-2.9-6.2-5.5-6.2z"/></svg><span>Clientes</span></a>
  <a href="#financeiro" data-tab="financeiro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="14" rx="3"/><path d="M3 10h18M15.5 15h2.5"/></svg><span>Financeiro</span></a>
</nav>
<input type="file" id="filepick" accept="image/*" hidden>
<input type="file" id="importpick" accept="application/json,.json" hidden>
<div id="lightbox" hidden><img alt=""></div>
<div id="toast"></div>

<script>
'use strict';
/* ---------- utilidades ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const BRL = new Intl.NumberFormat('pt-BR', {style: 'currency', currency: 'BRL'});
const money = v => BRL.format(v || 0);

/* ---------- sincronização com o Netlify ---------- */
let syncKey = null, lastRev = 0, syncTimer = null;
const syncState = {busy: false, last: null, error: null};
const metaGet = async k => { const r = await dbGet('meta', k); return r ? r.v : undefined; };
const metaSet = (k, v) => dbPut('meta', {id: k, v});
async function saveRec(col, rec) {

async function removeRec(col, id) {

}

function scheduleSync(ms = 1200) { if (!syncKey) return; clearTimeout(syncTimer); syncTimer = setTimeout(sync, ms); }
async function api(path, opts = {}) {

  if (!r.ok) { let msg = 'Erro ' + r.status; try { const j = await r.json(); if (j.error) msg = j.error; } catch (e) {} const err = new Error(msg); err.status = r.status; throw err; }

}
function syncLabel() {
  if (!syncKey) return 'Desligada';

  if (syncState.error) return '⚠️ ' + syncState.error;
  if (syncState.last) return 'Sincronizado às ' + new Date(syncState.last).toLocaleTimeString('pt-BR', {hour: '2-digit', minute: '2-digit'});
  return 'Aguardando…';
}
function updateSyncUI() {
  const dot = $('#sync-dot');
  if (dot) dot.className = !syncKey ? '' : syncState.busy ? 'busy' : syncState.error ? 'err' : 'ok';
  const st = $('#sync-status');

}
async function sync() {
  if (!syncKey || syncState.busy) return;
  if (!navigator.onLine) { syncState.error = 'Sem internet — envia quando voltar'; updateSyncUI(); return; }
  syncState.busy = true; updateSyncUI();
  let again = false;
  try {
    const out = await dbAll('outbox');
    for (const o of out.filter(o => o.col === 'photo')) {
      if (o.op === 'del') { try { await api('photo/' + o.rid, {method: 'DELETE'}); } catch (e) { if (e.status !== 404) throw e; } }
      else { const p = await dbGet('photos', o.rid); if (p) await api('photo/' + o.rid, {method: 'PUT', body: p.blob, headers: {'content-type': 'image/jpeg'}}); }
      const cur = await dbGet('outbox', o.id); if (cur && cur.t === o.t) await dbDel('outbox', o.id);
    }
    const recs = out.filter(o => o.col !== 'photo'); const changes = [];
    for (const o of recs) {
      const data = o.deleted ? null : await dbGet(o.col, o.rid);
      if (data) changes.push({col: o.col, id: o.rid, updatedAt: data.updatedAt || Date.now(), data});
      else changes.push({col: o.col, id: o.rid, updatedAt: o.updatedAt || Date.now(), deleted: true});
    }
    const r = await (await api('sync', {method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify({changes, sinceRev: lastRev})})).json();
    for (const o of recs) { const cur = await dbGet('outbox', o.id); if (cur && cur.t === o.t) await dbDel('outbox', o.id); else again = true; }
    let changed = false;
    for (const rec of r.records) {
      if (rec.col !== 'clients' && rec.col !== 'services') continue;
      const arr = rec.col === 'clients' ? clients : services;
      const local = arr.find(x => x.id === rec.id);
      if (local && (local.updatedAt || 0) > (rec.updatedAt || 0)) continue;
      if (rec.deleted) {
        if (local) { await dbDel(rec.col, rec.id); if (rec.col === 'clients') clients = clients.filter(x => x.id !== rec.id); else services = services.filter(x => x.id !== rec.id); changed = true; }
      } else if (!local || JSON.stringify(local) !== JSON.stringify(rec.data)) {
        await dbPut(rec.col, rec.data);
        const i = arr.findIndex(x => x.id === rec.id); if (i >= 0) arr[i] = rec.data; else arr.push(rec.data);
        changed = true;
      }

    lastRev = r.rev; await metaSet('lastRev', lastRev);
    syncState.last = Date.now(); syncState.error = null;
    if (changed) { const {route} = parseHash(); if (!route.endsWith('-editar')) render(true); }
  } catch (e) {
    syncState.error = e.status === 401 ? 'Senha incorreta — conecte de novo em Ajustes' : (e.message || 'Falha na sincronização');

}
async function connectSync(key) {
  key = (key || '').trim(); if (!key) return alert('Digite a senha.');
  const prev = syncKey; syncKey = key;
  try { await api('ping'); }
  catch (e) { syncKey = prev; return alert(e.status === 401 ? 'Senha incorreta.' : e.status === 404 ? 'O site ainda não tem a parte de sincronização publicada.' : 'Não foi possível conectar: ' + e.message); }
  await metaSet('syncKey', key); lastRev = 0; await metaSet('lastRev', 0);
  const t = Date.now();
  for (const c of clients) { if (!c.updatedAt) { c.updatedAt = t; await dbPut('clients', c); } await dbPut('outbox', {id: 'clients/' + c.id, col: 'clients', rid: c.id, t: t + Math.random()}); }
  for (const s of services) { if (!s.updatedAt) { s.updatedAt = t; await dbPut('services', s); } await dbPut('outbox', {id: 'services/' + s.id, col: 'services', rid: s.id, t: t + Math.random()}); }
  for (const k of await req('photos', 'readonly', st => st.getAllKeys())) await dbPut('outbox', {id: 'photo/' + k, col: 'photo', rid: k, op: 'put', t: t + Math.random()});
  toast('Conectado'); render(true); await sync(); render(true);
}
async function disconnectSync() {
  if (!confirm('Desconectar este aparelho? Os dados continuam aqui, mas param de sincronizar.')) return;
  syncKey = null; await metaSet('syncKey', null); await dbClear('outbox'); syncState.error = null; render(true);
}

/* ---------- fotos ---------- */
const photoCache = new Map(); const photoPending = new Map();
async function photoURL(id) {
  if (!id) return null;
  if (photoCache.has(id)) return photoCache.get(id);
  let rec = await dbGet('photos', id);
  if (!rec && syncKey) {
    if (!photoPending.has(id)) photoPending.set(id, (async () => {
      try { const blob = await (await api('photo/' + id)).blob(); const r = {id, blob}; await dbPut('photos', r); return r; } catch (e) { return null; } finally { photoPending.delete(id); }
    })());
    rec = await photoPending.get(id);
  }
  if (!rec) return null;
  const u = URL.createObjectURL(rec.blob); photoCache.set(id, u); return u;
}
function hydratePhotos() {
  document.querySelectorAll('img[data-photo]').forEach(async img => {
    const u = await photoURL(img.dataset.photo); if (u) img.src = u;
  });
}
async function compressImage(file, max = 1400) {
  const url = URL.createObjectURL(file);
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
  const r = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * r); c.height = Math.round(img.naturalHeight * r);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);

}

  clients.forEach(c => { (c.pets || []).forEach(p => p.photo && used.add(p.photo)); c.keyPhoto && used.add(c.keyPhoto); });

/* ---------- visitas (ocorrências) ---------- */
function occurrences(s) {
  const out = [];
  if (s.mode === 'personalizado') {
    (s.visits || []).filter(v => v.date).forEach(v => out.push({date: v.date, time: v.time || '', key: v.date + ' ' + (v.time || ''), s}));
    return out.sort((a, b) => a.key.localeCompare(b.key));
  }
  if (!s.start) return out;
  const e = parseD(s.end || s.start); const d = parseD(s.start);
  const times = (s.times || []).filter(Boolean).slice().sort();
  const wds = s.weekdays && s.weekdays.length ? s.weekdays : [0, 1, 2, 3, 4, 5, 6];
  let g = 0;
  while (d <= e && g++ < 1500) {
    if (wds.includes(d.getDay())) { const ds = fmtD(d); (times.length ? times : ['']).forEach(t => out.push({date: ds, time: t, key: ds + ' ' + t, s})); }
    d.setDate(d.getDate() + 1);
  }
  return out;
}
const totalOf = s => s.priceMode === 'total' ? (s.price || 0) : (s.price || 0) * occurrences(s).length;
const perVisit = s => { if (s.priceMode !== 'total') return s.price || 0; const n = occurrences(s).length; return n ? (s.price || 0) / n : 0; };
function occIn(a, b) {
  const out = [];
  for (const s of services) {
    if ((s.end || s.start) < a || s.start > b) continue;
    occurrences(s).forEach(o => { if (o.date >= a && o.date <= b) out.push(o); });
  }
  return out.sort((x, y) => x.key.localeCompare(y.key));
}
function wdText(s) {
  const w = s.weekdays || [];
  if (!w.length || w.length === 7) return 'Todos os dias';
  if (w.length === 5 && [1, 2, 3, 4, 5].every(x => w.includes(x))) return 'Seg a sex';
  return w.slice().sort().map(i => WDN[i]).join(', ');
}
function periodText(s) { const e = s.end || s.start; return e === s.start ? short(s.start) : `${short(s.start)} → ${short(e)}`; }
function statusOf(s) { const t = todayS(); if ((s.end || s.start) < t) return 'Concluído'; if (s.start > t) return 'Agendado'; return 'Em andamento'; }

/* ---------- AGENDA ---------- */
function viewAgenda() {
  setHeader('Agenda', {right: `<a class="hdr-btn gear" href="#ajustes" aria-label="Ajustes">${GEAR}<i id="sync-dot"></i></a>`});
  const t = todayS(); const sd = parseD(selDate);
  let a, b;
  if (agendaMode === 'mes') { a = fmtD(new Date(sd.getFullYear(), sd.getMonth() - 1, 1)); b = fmtD(new Date(sd.getFullYear(), sd.getMonth() + 2, 0)); }
  else { a = addDays(weekStart(selDate), -7); b = addDays(weekStart(selDate), 13); }
  const rangeOcc = occIn(a, b); const marks = {};
  rangeOcc.forEach(o => { const m = marks[o.date] || (marks[o.date] = {svc: 0, appt: 0}); if (isAppt(o.s)) m.appt++; else m.svc++; });
  const dot = d => { const m = marks[d]; return !m ? '' : m.svc ? 'dot' : 'dot appt'; };
  const dayOcc = rangeOcc.filter(o => o.date === selDate);
  const doneN = dayOcc.filter(o => o.s.done && o.s.done[o.key]).length;
  let h = syncKey ? '' : `<a class="card banner" href="#ajustes"><span style="font-size:22px">☁️</span><span class="small"><b>Sincronização desligada.</b> Os dados estão só neste aparelho. Toque para conectar.</span></a>`;
  h += `<div class="seg" style="margin-top:4px"><button class="${agendaMode === 'semana' ? 'on' : ''}" data-action="agenda-mode" data-m="semana">Semana</button><button class="${agendaMode === 'mes' ? 'on' : ''}" data-action="agenda-mode" data-m="mes">Mês</button></div>`;
  h += `<div class="carousel" id="car" aria-label="Deslize para ver ${agendaMode === 'mes' ? 'outros meses' : 'outras semanas'}">`;
  if (agendaMode === 'mes') {
    for (let k = -1; k <= 1; k++) h += monthPanel(sd.getFullYear(), sd.getMonth() + k, t, dot);
  } else {
    const ws = weekStart(selDate);
    for (let k = -1; k <= 1; k++) h += weekPanel(addDays(ws, 7 * k), t, dot);
  }
  h += `</div><div class="swipe-hint">‹ deslize para ${agendaMode === 'mes' ? 'trocar de mês' : 'trocar de semana'} ›</div>`;
  h += `<div class="day-head"><h2>${selDate === t ? 'Hoje · ' : ''}${esc(longDay(selDate))}</h2>`;
  h += selDate !== t ? `<button class="link" data-action="today">Hoje</button>` : `<label class="goto">Ir para data<input type="date" data-change="goto" value="${selDate}"></label>`;
  h += `</div>`;
  if (dayOcc.length) {
    const nv = dayOcc.filter(o => !isAppt(o.s)).length, na = dayOcc.length - nv; const parts = [];
    if (nv) parts.push(`${nv} ${nv === 1 ? 'visita' : 'visitas'}`);
    if (na) parts.push(`${na} ${na === 1 ? 'compromisso' : 'compromissos'}`);
    h += `<div class="muted small" style="margin:2px 2px 0">${parts.join(' · ')} · ${doneN} ${doneN === 1 ? 'feito' : 'feitos'}</div>`;
    h += dayOcc.map(o => occCard(o)).join('');
  } else {
    const next = occIn(addDays(selDate, 1), addDays(selDate, 120))[0];
    h += `<div class="empty"><div class="big">🐾</div>Nenhuma visita neste dia.`;
    if (next) { h += `<div style="margin-top:14px"><a class="pill" href="#" data-action="pick-day" data-d="${next.date}">Próxima: ${WDN[parseD(next.date).getDay()]} ${short(next.date)} ${esc(next.time)} · ${esc(titleOf(next.s))}</a></div>`; }
    h += `</div>`;
  }

}
function weekPanel(ws, t, dot) {
  const days = [...Array(7)].map((_, i) => addDays(ws, i));
  return `<div class="panel"><div class="days">${days.map(d => `<button class="day ${d === selDate ? 'sel' : ''} ${d === t ? 'today' : ''}" data-action="pick-day" data-d="${d}"><span>${WD[parseD(d).getDay()]}</span><b>${parseD(d).getDate()}</b><i class="${dot(d)}"></i></button>`).join('')}</div></div>`;
}
function monthPanel(y, m, t, dot) {

}

function finRange() {

function owedRows() {
  const t = todayS(); const rows = [];
  for (const s of services) {
    if (isAppt(s) || s.payStatus === 'pago') continue;
    const occ = occurrences(s); const past = occ.filter(o => o.date <= t); if (!past.length) continue;
    rows.push({s, n: past.length, total: occ.length, v: past.length * perVisit(s)});

}

  }
  // 2) resumo do mês

  const tot = {pendente: 0, cobrado: 0, pago: 0}; const rows = []; let visits = 0, doneV = 0;
  for (const s of services) {

    const os = occurrences(s).filter(o => o.date >= a && o.date <= b); if (!os.length) continue;

function paidChart() {
  const y = chartYear; const months = Array(12).fill(0);
  for (const s of services) {
    if (isAppt(s) || s.payStatus !== 'pago') continue;
    const pv = perVisit(s);
    for (const o of occurrences(s)) if (+o.date.slice(0, 4) === y) months[+o.date.slice(5, 7) - 1] += pv;
  }
  const max = Math.max(...months); const total = months.reduce((a, b) => a + b, 0);
  const anc = parseD(finAnchor); const now = new Date();
  const sel = finMode === 'mes' && anc.getFullYear() === y ? anc.getMonth() : (now.getFullYear() === y ? now.getMonth() : -1);
  const compact = v => v >= 1000 ? (v / 1000).toFixed(1).replace('.', ',').replace(',0', '') + 'k' : String(Math.round(v));
  const fullMonth = i => cap(new Date(y, i, 1).toLocaleDateString('pt-BR', {month: 'long'}));
  let h = `<div class="sec">Recebido mês a mês</div><div class="card">
    <div class="chart-head"><span class="muted small">Só serviços marcados como <b>Pago</b></span>
      <div class="yr"><button class="arrow" data-action="year-nav" data-n="-1" aria-label="Ano anterior">‹</button><b>${y}</b><button class="arrow" data-action="year-nav" data-n="1" aria-label="Próximo ano">›</button></div></div>
    <div class="chart" role="img" aria-label="Valores recebidos por mês em ${y}">`;
  h += months.map((v, i) => {
    const pct = max ? v / max * 84 : 0; const label = v && (i === sel || v === max);
    return `<button class="col" data-action="fin-month" data-m="${i}" title="${MN[i]}: ${money(v)}" aria-label="${fullMonth(i)}: ${money(v)}">
      ${label ? `<span class="val">${compact(v)}</span>` : ''}<i style="height:${pct}%"></i></button>`;
  }).join('');
  h += `</div><div class="months">${MN.map((m, i) => `<span class="${i === sel ? 'sel' : ''}">${m}</span>`).join('')}</div>`;
  if (!total) h += `<div class="chart-empty">Nenhum valor marcado como pago em ${y}.</div>`;
  h += `<div class="chart-info"><span>${sel >= 0 ? `${fullMonth(sel)}: <b>${money(months[sel])}</b>` : ''}</span><span class="muted">Ano: <b style="color:var(--ink)">${money(total)}</b></span></div>
    <div class="muted small" style="margin-top:4px">Toque numa barra para ver o resumo daquele mês.</div></div>`;
  return h;
}

async function fillStorageInfo() {

const blobToDataURL = b => new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(b); });
async function exportData() {
  const photos = await dbAll('photos'); const ph = {};
  for (const p of photos) ph[p.id] = await blobToDataURL(p.blob);
  const data = {app: 'patinhas', version: 1, exportedAt: new Date().toISOString(), clients, services, photos: ph};
  const name = `patinhas-backup-${todayS()}.json`;
  const blob = new Blob([JSON.stringify(data)], {type: 'application/json'});
  const file = new File([blob], name, {type: 'application/json'});
  let ok = false;
  if (navigator.canShare && navigator.canShare({files: [file]})) {
    try { await navigator.share({files: [file], title: name}); ok = true; } catch (e) { if (e.name === 'AbortError') return; }
  }
  if (!ok) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); }
  try { localStorage.setItem('lastBackup', Date.now()); } catch (e) {}
  render(true);
}
async function importData(file) {
  try {
    const data = JSON.parse(await file.text());
    if (data.app !== 'patinhas') throw new Error('Arquivo não é um backup do Patinhas.');
    if (!confirm(`Restaurar ${data.clients.length} clientes e ${data.services.length} serviços? Os dados atuais deste aparelho serão substituídos.`)) return;
    const oldC = clients.map(x => x.id), oldS = services.map(x => x.id);
    await dbClear('clients'); await dbClear('services'); await dbClear('photos'); photoCache.clear();
    for (const [id, url] of Object.entries(data.photos || {})) { await dbPut('photos', {id, blob: await (await fetch(url)).blob()}); if (syncKey) await queuePhoto(id, 'put'); }
    clients = []; services = [];
    for (const c of data.clients) { if (syncKey) await saveRec('clients', c); else await dbPut('clients', c); clients.push(c); }
    for (const s of data.services) { if (syncKey) await saveRec('services', s); else await dbPut('services', s); services.push(s); }
    if (syncKey) {
      for (const id of oldC) if (!clients.some(x => x.id === id)) await removeRec('clients', id);
      for (const id of oldS) if (!services.some(x => x.id === id)) await removeRec('services', id);
    }
    toast('Backup restaurado'); location.hash = '#agenda';
  } catch (e) { alert('Não foi possível restaurar: ' + e.message); }
}

    case 'agenda-mode': agendaMode = d.m; try { localStorage.setItem('agendaMode', d.m); } catch (err) {} render(true); break;
    case 'today': selDate = todayS(); render(true); break;

    case 'cycle-pay': if (sv) { const order = ['pendente', 'cobrado', 'pago']; sv.payStatus = order[(order.indexOf(sv.payStatus) + 1) % 3]; await saveRec('services', sv); render(true); } break;
    case 'all-visits': showAllVisits = !showAllVisits; render(true); break;

    case 'svc-filter': svcFilter = d.f; render(true); break;
    case 'fin-nav': { const n = +d.n; const x = parseD(finAnchor); finAnchor = fmtD(new Date(x.getFullYear(), x.getMonth() + n, 1)); chartYear = parseD(finAnchor).getFullYear(); render(true); break; }
    // formulários
    case 'set':
      if (d.path === 'mode') {
        if (d.val === 'personalizado' && form.mode !== 'personalizado') toCustom();
        else if (d.val === 'repetir' && form.mode === 'personalizado') { const s = formAsService(); if (s.start) { form.start = s.start; form.end = s.end; } form.mode = 'repetir'; }
      } else setPath(form, d.path, d.val);
      render(true); break;
    case 'set-kind': if (d.val === 'compromisso') setKind('compromisso'); else form.kind = 'servico'; render(true); break;
    case 'to-custom': toCustom(); render(true); break;
    case 'add-visit': { const last = form.visits[form.visits.length - 1]; form.visits.push({date: last ? last.date : todayS(), time: ''}); render(true); break; }
    case 'remove-visit': form.visits.splice(+d.i, 1); if (!form.visits.length) form.visits.push({date: todayS(), time: ''}); render(true); break;
    case 'year-nav': chartYear += +d.n; render(true); break;
    case 'fin-month': finAnchor = fmtD(new Date(chartYear, +d.m, 1)); render(true); { const sec = [...document.querySelectorAll('.sec')].find(x => x.textContent === 'Resumo do mês'); if (sec) sec.scrollIntoView({behavior: 'smooth'}); } break;
    case 'toggle-wd': { const i = +d.i; form.weekdays = form.weekdays.includes(i) ? form.weekdays.filter(x => x !== i) : [...form.weekdays, i].sort(); render(true); break; }
    case 'add-time': form.times.push(''); render(true); break;
    case 'remove-time': form.times.splice(+d.i, 1); if (!form.times.length) form.times.push(''); render(true); break;
    case 'add-pet': form.pets.push({id: uid(), name: '', species: '', photo: null}); render(true); break;
    case 'remove-pet': { const p = form.pets.splice(+d.i, 1)[0]; if (p && p.photo) form._del.push(p.photo); render(true); break; }
    case 'pick-photo': pickTarget = d.path; $('#filepick').value = ''; $('#filepick').click(); break;
    case 'remove-photo': { const old = getPath(form, d.path); if (old) form._del.push(old); setPath(form, d.path, null); render(true); break; }
    case 'save-service': saveService(); break;
    case 'delete-service': if (sv && confirm('Excluir este serviço?')) { await removeRec('services', sv.id); services = services.filter(s => s.id !== sv.id); form = null; toast('Serviço excluído'); location.replace('#servicos'); } break;
    case 'new-client-from-service': formStack.push(form); location.hash = '#cliente-editar/new?ret=1'; break;
    case 'save-client': saveClient(d.ret === '1'); break;
    case 'delete-client': {
      const c = clientById(form.id); if (!c) break; const svs = services.filter(s => s.clientId === c.id);
      if (!confirm(svs.length ? `Excluir o cliente e ${svs.length} serviço(s) dele?` : 'Excluir este cliente?')) break;
      for (const s of svs) await removeRec('services', s.id);
      services = services.filter(s => s.clientId !== c.id);
      for (const p of (c.pets || [])) await deletePhoto(p.photo); await deletePhoto(c.keyPhoto);
      await removeRec('clients', c.id); clients = clients.filter(x => x.id !== c.id); form = null; toast('Cliente excluído'); location.replace('#clientes'); break;
    }
    case 'export': exportData(); break;
    case 'sync-on': connectSync($('#sync-pass') && $('#sync-pass').value); break;
    case 'sync-now': sync(); break;
    case 'sync-off': disconnectSync(); break;
    case 'import': $('#importpick').value = ''; $('#importpick').click(); break;
  }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.bind && form) {
    setPath(form, el.dataset.bind, el.value);
    if (el.dataset.bind === 'start' && el.value && (!form.end || form.end < el.value)) { form.end = el.value; const end = $('#end'); if (end) end.value = el.value; }
    if (el.dataset.live) updateLive();
  }
  if (el.dataset.filter === 'svc') { svcSearch = el.value; $('#list').innerHTML = servicesList(); hydratePhotos(); }
  if (el.dataset.filter === 'pick') { pickSearch = el.value; const pl = $('#picklist'); if (pl) { pl.innerHTML = pickList(); hydratePhotos(); } }
  if (el.dataset.filter === 'cli') { cliSearch = el.value; $('#list').innerHTML = clientsList(); hydratePhotos(); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.bind && form) { setPath(form, el.dataset.bind, el.value); if (el.dataset.live) updateLive(); if (el.dataset.rerender) render(true); }
  if (el.dataset.change === 'goto' && el.value) { selDate = el.value; render(true); }
});
$('#filepick').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f || !form || !pickTarget) return;
  try {
    const blob = await compressImage(f); const id = uid();
    await dbPut('photos', {id, blob}); queuePhoto(id, 'put');
    const old = getPath(form, pickTarget); if (old) form._del.push(old);
    setPath(form, pickTarget, id); render(true);
  } catch (err) { alert('Não foi possível carregar a foto.'); }
});
$('#importpick').addEventListener('change', e => { const f = e.target.files[0]; if (f) importData(f); });
$('#lightbox').addEventListener('click', () => { $('#lightbox').hidden = true; });
window.addEventListener('hashchange', () => render(false));

/* ---------- início ---------- */
(async () => {
  try {
    await openDB();
    clients = await dbAll('clients'); services = await dbAll('services');
    syncKey = (await metaGet('syncKey')) || null; lastRev = (await metaGet('lastRev')) || 0;
    cleanupPhotos().catch(() => {});
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  } catch (e) { view.innerHTML = '<div class="empty">Não foi possível abrir o armazenamento deste navegador.</div>'; return; }
  render();
  if (syncKey) sync();
  setInterval(() => { if (document.visibilityState === 'visible') sync(); }, 60000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') sync(); });
  window.addEventListener('online', () => sync());
})();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
